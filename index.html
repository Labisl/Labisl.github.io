<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labisl</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFD700 0%, #9ACD32 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
        }
        
        .visit-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 215, 0, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            color: #333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #FFD700 0%, #9ACD32 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="visit-counter">Website visits: <span id="visit-count">0</span></div>
    <div class="container">
        <h1>labisl</h1>
        <h2>A cool website of.. ..stuff</h2>
        <p>This website is currently under construction, but you can view my projects!</p>
        <a href="Downloads/" class="btn">Browse projects</a>
    </div>

    <script>
        // Initialize and update visit counter
        function updateVisitCount() {
            // Get current visit count from localStorage
            let visitCount = localStorage.getItem('visitCount');
            
            // If no count exists, start at 1, otherwise increment
            if (visitCount === null) {
                visitCount = 1;
            } else {
                visitCount = parseInt(visitCount) + 1;
            }
            
            // Save updated count
            localStorage.setItem('visitCount', visitCount);
            
            // Display the count
            document.getElementById('visit-count').textContent = visitCount;
        }
        
        // Run on page load
        window.addEventListener('load', updateVisitCount);
    </script>
</body>
</html>
