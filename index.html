<!DOCTYPE html>
<html>
<head>
    <title>Labisl Markdown</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        textarea {
            width: 45%;
            height: 400px;
            font-size: 16px;
            padding: 10px;
        }

        #preview {
            width: 45%;
            height: 400px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow: auto;
        }
    </style>
</head>

<body>

<textarea id="editor">
# Hello!

Write **Markdown** here.
Whatever you write is completely private!

[Google](https://google.com)
</textarea>

<div id="preview"></div>

<script>
function markdown(text) {
    return text
        .replace(/^### (.*$)/gim, "<h3>$1</h3>")
        .replace(/^## (.*$)/gim, "<h2>$1</h2>")
        .replace(/^# (.*$)/gim, "<h1>$1</h1>")
        .replace(/\*\*(.*?)\*\*/gim, "<b>$1</b>")
        .replace(/\*(.*?)\*/gim, "<i>$1</i>")
        .replace(/\n/gim, "<br>");
}

function update() {
    document.getElementById("preview").innerHTML =
        markdown(document.getElementById("editor").value);
}

document.getElementById("editor").addEventListener("input", update);

update();
</script>

</body>
</html>
