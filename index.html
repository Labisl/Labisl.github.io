<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Labisl Markdown</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        textarea {
            width: 45%;
            height: 400px;
            font-size: 16px;
            padding: 10px;
            resize: none;
        }

        #preview {
            width: 45%;
            height: 400px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow: auto;
        }

        a {
            color: dodgerblue;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<textarea id="editor"># Hello!

Write **Markdown** here.
Whatever you write is completely private!

[Google](https://google.com)

*Italic*

**Bold**

### Small Heading
</textarea>

<div id="preview"></div>

<script>
function markdown(text) {
    return text
        // Escape HTML
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")

        // Headings
        .replace(/^### (.*)$/gim, "<h3>$1</h3>")
        .replace(/^## (.*)$/gim, "<h2>$1</h2>")
        .replace(/^# (.*)$/gim, "<h1>$1</h1>")

        // Bold
        .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")

        // Italic
        .replace(/\*(.*?)\*/g, "<i>$1</i>")

        // Links
        .replace(
            /\[(.*?)\]\((https?:\/\/.*?)\)/g,
            '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
        )

        // New lines
        .replace(/\n/g, "<br>");
}

function update() {
    const editor = document.getElementById("editor");
    const preview = document.getElementById("preview");
    preview.innerHTML = markdown(editor.value);
}

document.getElementById("editor").addEventListener("input", update);

update();
</script>

</body>
</html>
