<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Labisl Markdown</title>

<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    gap: 20px;
    padding: 20px;
}

textarea {
    width: 45%;
    height: 400px;
    font-size: 16px;
    padding: 10px;
    resize: none;
}

#preview {
    width: 45%;
    height: 400px;
    border: 1px solid #ccc;
    padding: 10px;
    overflow: auto;
}

a {
    color: dodgerblue;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}
</style>

</head>
<body>

<textarea id="editor"># Hello!

Write **Markdown** here.
Whatever you write is completely private!

[Google](https://google.com)

*Italic*

**Bold**

### Small Heading
</textarea>

<div id="preview"></div>

<script>
function markdown(text) {

    // Escape HTML
    text = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    // Links (do BEFORE italic/bold)
    text = text.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );

    // Headings
    text = text.replace(/^### (.*)$/gm, "<h3>$1</h3>");
    text = text.replace(/^## (.*)$/gm, "<h2>$1</h2>");
    text = text.replace(/^# (.*)$/gm, "<h1>$1</h1>");

    // Bold
    text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

    // Italic
    text = text.replace(/\*(.+?)\*/g, "<em>$1</em>");

    // New lines
    text = text.replace(/\n/g, "<br>");

    return text;
}

const editor = document.getElementById("editor");
const preview = document.getElementById("preview");

function updatePreview() {
    preview.innerHTML = markdown(editor.value);
}

editor.addEventListener("input", updatePreview);

// Initial render
updatePreview();
</script>

</body>
</html>
