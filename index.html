<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Labisl Markdown</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        textarea {
            width: 45%;
            height: 400px;
            font-size: 16px;
            padding: 10px;
            resize: none;
        }

        #preview {
            width: 45%;
            height: 400px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow: auto;
        }

        a {
            color: dodgerblue;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<textarea id="editor"># Hello!

Write **Markdown** here.
Whatever you write is completely private!

[Google](https://google.com)

*Italic*

**Bold**

### Small Heading
</textarea>

<div id="preview"></div>

<script>
function markdown(text) {
    // Escape HTML first
    text = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    // Headings
    text = text.replace(/^### (.*)$/gm, "<h3>$1</h3>");
    text = text.replace(/^## (.*)$/gm, "<h2>$1</h2>");
    text = text.replace(/^# (.*)$/gm, "<h1>$1</h1>");

    // Bold
    text = text.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");

    // Italic
    text = text.replace(/\*(.*?)\*/g, "<i>$1</i>");

    // Links
    text = text.replace(
        /\[([^\]]+)\]\(([^)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );

    // Line breaks
    text = text.replace(/\n/g, "<br>");

    return text;
}
</script>

</body>
</html>
