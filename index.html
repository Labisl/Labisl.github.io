<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Labisl Markdown</title>

<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    gap: 20px;
    padding: 20px;
}

textarea {
    width: 45%;
    height: 400px;
    font-size: 16px;
    padding: 10px;
    resize: none;
}

#preview {
    width: 45%;
    height: 400px;
    border: 1px solid #ccc;
    padding: 10px;
    overflow: auto;
}

a {
    color: dodgerblue;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}
</style>

</head>
<body>

<textarea id="editor"># Hello!

Write **Markdown** here.
Whatever you write is completely private!

[Google](https://google.com)

*Italic*

**Bold**

### Small Heading
</textarea>

<div id="preview"></div>

<script>
function markdown(text){

    // Store code blocks first
    const codeBlocks = [];
    text = text.replace(/```([\s\S]*?)```/g,function(match,code){
        codeBlocks.push("<pre><code>"+code.replace(/</g,"&lt;").replace(/>/g,"&gt;")+"</code></pre>");
        return "%%CODE"+(codeBlocks.length-1)+"%%";
    });

    // Escape HTML
    text=text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

    // Restore code blocks
    text=text.replace(/%%CODE(\d+)%%/g,function(_,n){
        return codeBlocks[n];
    });

    // Escape markdown symbols
    text=text.replace(/\\([\\`*_{}\[\]()#+\-.!|>])/g,"&#92;$1");

    // Images
    text=text.replace(
        /!\[([^\]]*)\]\((.*?)\)/g,
        '<img src="$2" alt="$1">'
    );

    // Links
    text=text.replace(
        /\[([^\]]+)\]\((.*?)\)/g,
        '<a href="$2" target="_blank">$1</a>'
    );

    // Headings
    for(let i=6;i>=1;i--){
        const hashes="#".repeat(i);
        text=text.replace(
            new RegExp("^"+hashes+" (.*)$","gm"),
            "<h"+i+">$1</h"+i+">"
        );
    }

    // Horizontal rules
    text=text.replace(/^(\*\*\*|---|___)$/gm,"<hr>");

    // Blockquotes
    text=text.replace(/^> (.*)$/gm,"<blockquote>$1</blockquote>");

    // Bold Italic
    text=text.replace(/\*\*\*(.*?)\*\*\*/g,"<strong><em>$1</em></strong>");

    // Bold
    text=text.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");

    // Italic
    text=text.replace(/\*(.*?)\*/g,"<em>$1</em>");

    // Inline code
    text=text.replace(/`([^`]+)`/g,"<code>$1</code>");

    // Checkboxes
    text=text.replace(/^- \[x\] (.*)$/gim,'<input type="checkbox" checked disabled> $1');
    text=text.replace(/^- \[ \] (.*)$/gim,'<input type="checkbox" disabled> $1');

    // Bullet lists
    text=text.replace(/(?:^- .*$(?:\n|$))+?/gm,function(list){
        return "<ul>"+list.replace(/^- (.*)$/gm,"<li>$1</li>")+"</ul>";
    });

    // Numbered lists
    text=text.replace(/(?:^\d+\. .*$(?:\n|$))+?/gm,function(list){
        return "<ol>"+list.replace(/^\d+\. (.*)$/gm,"<li>$1</li>")+"</ol>";
    });

    // Tables
    text=text.replace(
        /((?:\|.*\|\n)+)/g,
        function(table){

            const rows=table.trim().split("\n");

            if(rows.length<2) return table;

            let html="<table border='1' cellspacing='0' cellpadding='5'>";

            rows.forEach(function(row,index){

                if(index==1 && /^\|?[- :|]+\|?$/.test(row)) return;

                const cells=row.split("|").slice(1,-1);

                html+="<tr>";

                cells.forEach(function(cell){

                    if(index==0)
                        html+="<th>"+cell.trim()+"</th>";
                    else
                        html+="<td>"+cell.trim()+"</td>";

                });

                html+="</tr>";

            });

            html+="</table>";

            return html;

        }
    );

    // Paragraphs
    text=text.split(/\n\s*\n/).map(function(block){

        if(block.match(/^<(h|ul|ol|pre|blockquote|table|hr)/))
            return block;

        return "<p>"+block+"</p>";

    }).join("");

    // Single newlines
    text=text.replace(/\n/g,"<br>");

    return text;
}

const editor=document.getElementById("editor");
const preview=document.getElementById("preview");

function updatePreview(){
    preview.innerHTML=markdown(editor.value);
}

editor.addEventListener("input",updatePreview);

updatePreview();
</script>

</body>
</html>
