<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Goings</title>
  <style>
    :root {
      --bg-1: #0d1320;
      --bg-2: #1a2438;
      --bg-3: #2d3b4f;
      --glass: rgba(17, 24, 39, 0.66);
      --gold-1: #fff7d6;
      --gold-2: #fce38a;
      --gold-3: #f4b942;
      --gold-4: #e28b2f;
      --gold-5: #bf5f1d;
      --gold-6: #7f3f11;
      --text: #ffeec5;
      --text-deep: #4a2602;
      --shadow: rgba(8, 12, 18, 0.6);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 210, 120, 0.28), transparent 30%),
        radial-gradient(circle at 82% 22%, rgba(255, 245, 216, 0.18), transparent 28%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 42%, var(--bg-3));
      color: var(--text);
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 40%, rgba(0,0,0,0.18)),
        repeating-linear-gradient(
          180deg,
          rgba(255,255,255,0.02),
          rgba(255,255,255,0.02) 2px,
          transparent 2px,
          transparent 6px
        );
      pointer-events: none;
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, rgba(31,41,55,0.74), rgba(15,23,42,0.8));
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      padding: 32px 24px;
      max-width: 420px;
      width: 90%;
      box-shadow:
        0 24px 50px rgba(0,0,0,0.42),
        inset 0 1px 0 rgba(255,255,255,0.25),
        inset 0 -1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 14px 0;
      color: rgba(255,255,255,0.86);
    }

    button {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-width: 180px;
      padding: 16px 32px;
      border: 1px solid rgba(255, 245, 190, 0.82);
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.24) 14%, rgba(255,255,255,0.06) 45%, transparent 46%),
        linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 16%, var(--gold-3) 34%, var(--gold-4) 62%, var(--gold-5) 100%);
      color: var(--text-deep);
      font: 800 1rem/1 Arial, sans-serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
      cursor: pointer;
      box-shadow:
        0 4px 0 rgba(97, 52, 15, 0.9),
        0 10px 18px rgba(0,0,0,0.44),
        0 0 18px rgba(248, 193, 79, 0.18),
        inset 0 2px 3px rgba(255,255,255,0.9),
        inset 0 -4px 8px rgba(110, 58, 7, 0.48);
      transition: transform 160ms ease, box-shadow 180ms ease, filter 180ms ease;
      animation: floatButton 2.8s ease-in-out infinite;
    }

    button::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 10%;
      width: 80%;
      height: 34%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.1) 65%, transparent 100%);
      filter: blur(1px);
      opacity: 0.9;
      pointer-events: none;
    }

    button::after {
      content: "";
      position: absolute;
      inset: -28% -18% auto auto;
      width: 38%;
      height: 180%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.82), rgba(255,255,255,0.18), transparent);
      transform: rotate(23deg) translateX(-20px);
      opacity: 0.85;
      pointer-events: none;
      animation: sheen 3.1s ease-in-out infinite;
    }

    button:hover {
      transform: translateY(-3px) scale(1.015);
      filter: brightness(1.08) saturate(1.12);
      box-shadow:
        0 6px 0 rgba(97, 52, 15, 0.9),
        0 16px 26px rgba(0,0,0,0.5),
        0 0 25px rgba(247, 194, 83, 0.28),
        inset 0 2px 4px rgba(255,255,255,0.95),
        inset 0 -4px 8px rgba(110, 58, 7, 0.5);
    }

    button:active {
      transform: translateY(4px) scale(0.99);
      box-shadow:
        0 2px 0 rgba(97, 52, 15, 0.9),
        0 8px 14px rgba(0,0,0,0.4),
        inset 0 2px 4px rgba(74,38,2,0.35),
        inset 0 -2px 4px rgba(255,255,255,0.4);
    }

    button:focus-visible {
      outline: 3px solid rgba(255,255,255,0.85);
      outline-offset: 5px;
    }

    .count {
      display: inline-block;
      margin-top: 16px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #fcd778;
      text-shadow: 0 0 18px rgba(252, 215, 120, 0.35);
    }

    @keyframes floatButton {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1px); }
    }

    @keyframes sheen {
      0% { transform: translateX(-30px) rotate(23deg); opacity: 0.15; }
      18% { opacity: 0.8; }
      48% { transform: translateX(180px) rotate(23deg); opacity: 0.9; }
      100% { transform: translateX(220px) rotate(23deg); opacity: 0.12; }
    }

    @media (prefers-reduced-motion: reduce) {
      button, button::after {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign Goings</h1>
    <p>Click below to add your vote.</p>
    <button id="addButton" type="button">ADD VOTE</button>
    <p class="count">Votes: <span id="count">0</span></p>
  </div>

  <script>
    const button = document.getElementById('addButton');
    const countEl = document.getElementById('count');
    const storageKey = 'signgoings-count';

    let count = Number(localStorage.getItem(storageKey) || 0);
    countEl.textContent = count;

    button.addEventListener('click', () => {
      count += 1;
      localStorage.setItem(storageKey, String(count));
      countEl.textContent = count;
    });
  </script>
</body>
</html>
