<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Goings</title>
  <style>
    :root {
      color-scheme: dark;
      --gold-light: #fff8df;
      --gold: #f7c45c;
      --amber: #e99032;
      --copper: #a64e20;
      --ink: #45280f;
    }

    * { box-sizing: border-box; }

    body {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff8e9;
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      background:
        radial-gradient(ellipse at 74% 14%, rgba(255, 202, 111, .55), transparent 28%),
        radial-gradient(ellipse at 76% 18%, rgba(255, 237, 191, .22), transparent 42%),
        linear-gradient(155deg, #182333 0%, #344253 48%, #172334 100%);
    }

    /* Sunlight breaking through a rainy window. */
    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: -35%;
      pointer-events: none;
      background: conic-gradient(from 224deg at 73% 26%, transparent 0 7deg, rgba(255, 222, 164, .09) 10deg, transparent 24deg, rgba(255, 213, 145, .06) 34deg, transparent 52deg);
      filter: blur(18px);
      animation: sunDrift 18s ease-in-out infinite alternate;
    }

    /* Fine diagonal rain, with a second distant layer. */
    .rain {
      position: fixed;
      z-index: -1;
      inset: -30% -10%;
      pointer-events: none;
      opacity: .48;
      background-image:
        repeating-linear-gradient(108deg, transparent 0 35px, rgba(222, 238, 255, .16) 36px, transparent 38px, transparent 74px),
        repeating-linear-gradient(108deg, transparent 0 82px, rgba(255, 228, 176, .11) 83px, transparent 85px, transparent 150px);
      background-size: 190px 230px, 310px 360px;
      animation: rainFall .72s linear infinite;
      mask-image: linear-gradient(180deg, transparent, #000 12%, #000 86%, transparent);
    }

    .card {
      position: relative;
      width: min(440px, 100%);
      padding: 38px 28px 30px;
      overflow: hidden;
      border: 1px solid rgba(255, 244, 215, .28);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(20,29,43,.62) 38%, rgba(13,20,31,.76));
      box-shadow: 0 28px 70px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.25), inset 0 -1px 0 rgba(255,255,255,.06);
      -webkit-backdrop-filter: blur(14px) saturate(1.25);
      backdrop-filter: blur(14px) saturate(1.25);
    }

    .card::before {
      content: "";
      position: absolute;
      top: -105px;
      right: -80px;
      width: 260px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255, 203, 117, .2);
      filter: blur(55px);
      pointer-events: none;
    }

    h1 {
      position: relative;
      margin: 0 0 12px;
      font-size: 2rem;
      letter-spacing: .045em;
      text-shadow: 0 2px 18px rgba(255, 218, 154, .22);
    }

    p {
      position: relative;
      margin: 14px 0;
      color: rgba(255, 250, 239, .87);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    #addButton {
      --pointer-x: 50%;
      --pointer-y: 26%;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-width: 196px;
      margin: 12px 0 4px;
      padding: 17px 32px 16px;
      border: 1px solid rgba(255, 249, 218, .92);
      border-radius: 999px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at var(--pointer-x) var(--pointer-y), rgba(255,255,255,.95), transparent 33%),
        linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.52) 5%, rgba(255,255,255,.1) 23%, transparent 43%),
        linear-gradient(180deg, #fff4bd 0%, #ffda7c 16%, #f5b64b 39%, #e28a35 72%, #bd5c25 100%);
      font: 800 1rem/1 "Segoe UI", Arial, sans-serif;
      letter-spacing: .16em;
      text-shadow: 0 1px 0 rgba(255,255,255,.78);
      cursor: pointer;
      transform: translateY(0);
      box-shadow:
        0 5px 0 #773b1c,
        0 9px 13px rgba(0,0,0,.34),
        0 0 0 1px rgba(96,48,18,.45),
        0 0 22px rgba(255,193,89,.2),
        inset 0 2px 2px rgba(255,255,255,.96),
        inset 0 -5px 9px rgba(117,53,14,.4);
      transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease, filter .22s ease;
      animation: buttonBreathe 4s ease-in-out infinite;
    }

    #addButton::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 3px 9px auto;
      height: 42%;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.22) 50%, transparent);
      box-shadow: 0 1px 0 rgba(255,255,255,.32);
      pointer-events: none;
    }

    #addButton::after {
      content: "";
      position: absolute;
      z-index: 1;
      top: -65%;
      bottom: -65%;
      left: -48%;
      width: 27%;
      border-radius: 50%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.86), rgba(255,250,222,.4), transparent);
      filter: blur(2px);
      transform: rotate(23deg);
      opacity: 0;
      pointer-events: none;
    }

    #addButton:hover {
      z-index: 2;
      transform: translateY(-5px) scale(1.035);
      filter: brightness(1.08) saturate(1.12);
      box-shadow:
        0 8px 0 #773b1c,
        0 17px 25px rgba(0,0,0,.42),
        0 0 12px rgba(255,221,154,.5),
        0 0 38px rgba(255,174,70,.34),
        inset 0 2px 3px #fff,
        inset 0 -5px 9px rgba(117,53,14,.38);
    }

    #addButton:hover::after {
      animation: glassSweep .9s cubic-bezier(.2,.65,.3,1) forwards;
    }

    #addButton:active {
      transform: translateY(3px) scale(.985);
      filter: brightness(.98);
      box-shadow: 0 2px 0 #773b1c, 0 4px 8px rgba(0,0,0,.38), inset 0 3px 7px rgba(96,43,12,.42);
    }

    #addButton:focus-visible {
      outline: 3px solid #fff4c9;
      outline-offset: 6px;
    }

    #addButton .ripple {
      position: absolute;
      z-index: 3;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,.72);
      transform: translate(-50%, -50%) scale(0);
      animation: ripple .65s ease-out forwards;
      pointer-events: none;
    }

    .count {
      display: inline-block;
      margin-top: 16px;
      color: #ffdc8a;
      font-size: 1.5rem;
      font-weight: 800;
      text-shadow: 0 0 18px rgba(255, 195, 91, .35);
    }

    @keyframes rainFall {
      from { background-position: 0 0, 0 0; }
      to { background-position: -48px 230px, -90px 360px; }
    }
    @keyframes sunDrift {
      from { transform: translate3d(-1%, 0, 0) rotate(-2deg); opacity: .65; }
      to { transform: translate3d(2%, 1%, 0) rotate(2deg); opacity: 1; }
    }
    @keyframes buttonBreathe {
      0%, 100% { box-shadow: 0 5px 0 #773b1c, 0 9px 13px rgba(0,0,0,.34), 0 0 0 1px rgba(96,48,18,.45), 0 0 22px rgba(255,193,89,.2), inset 0 2px 2px rgba(255,255,255,.96), inset 0 -5px 9px rgba(117,53,14,.4); }
      50% { box-shadow: 0 5px 0 #773b1c, 0 10px 15px rgba(0,0,0,.36), 0 0 0 1px rgba(96,48,18,.45), 0 0 29px rgba(255,193,89,.29), inset 0 2px 2px rgba(255,255,255,.96), inset 0 -5px 9px rgba(117,53,14,.4); }
    }
    @keyframes glassSweep {
      from { left: -48%; opacity: 0; }
      12% { opacity: .9; }
      to { left: 125%; opacity: 0; }
    }
    @keyframes ripple {
      to { transform: translate(-50%, -50%) scale(18); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
      .rain { display: none; }
    }
  </style>
</head>
<body>
  <div class="rain" aria-hidden="true"></div>
  <main class="card">
    <h1>Sign Goings</h1>
    <p>Click below to add your vote.</p>
    <button id="addButton" type="button">ADD VOTE</button>
    <p class="count">Votes: <span id="count">0</span></p>
  </main>

  <script>
    const button = document.getElementById('addButton');
    const countEl = document.getElementById('count');
    const storageKey = 'signgoings-count';

    let count = Number(localStorage.getItem(storageKey) || 0);
    countEl.textContent = count;

    button.addEventListener('pointermove', (event) => {
      const bounds = button.getBoundingClientRect();
      const x = ((event.clientX - bounds.left) / bounds.width) * 100;
      const y = ((event.clientY - bounds.top) / bounds.height) * 100;
      button.style.setProperty('--pointer-x', `${x}%`);
      button.style.setProperty('--pointer-y', `${y}%`);
    });

    button.addEventListener('click', (event) => {
      count += 1;
      localStorage.setItem(storageKey, String(count));
      countEl.textContent = count;

      const bounds = button.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.setAttribute('aria-hidden', 'true');
      ripple.style.left = `${event.clientX - bounds.left}px`;
      ripple.style.top = `${event.clientY - bounds.top}px`;
      button.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
    });
  </script>
</body>
</html>
