<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101426">
  <title>Sign Goings</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      --glass: rgba(26, 31, 54, .58);
      --text: #fffaf1;
      --gold: #ffe6a0;
      --pointer-x: 50%;
      --pointer-y: 20%;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      padding: 24px;
      color: var(--text);
      text-align: center;
      background:
        radial-gradient(ellipse at 75% 15%, rgba(255, 139, 103, .3), transparent 34%),
        radial-gradient(ellipse at 15% 85%, rgba(111, 95, 255, .26), transparent 38%),
        linear-gradient(145deg, #101629, #242b48 52%, #11182d);
    }

    #lightCanvas {
      position: fixed;
      z-index: -1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .card {
      position: relative;
      width: min(460px, 100%);
      padding: 46px 32px 35px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255,255,255,.17), var(--glass) 42%, rgba(13,17,34,.74));
      box-shadow: 0 32px 90px rgba(0,0,0,.46), 0 0 70px rgba(255,133,132,.12), inset 0 1px 0 rgba(255,255,255,.36), inset 0 -1px 0 rgba(255,255,255,.08);
      -webkit-backdrop-filter: blur(22px) saturate(1.45);
      backdrop-filter: blur(22px) saturate(1.45);
    }

    .card::before {
      content: "";
      position: absolute;
      top: -150px;
      right: -100px;
      width: 300px;
      height: 240px;
      border-radius: 50%;
      background: rgba(255, 184, 122, .26);
      filter: blur(68px);
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(125deg, rgba(255,255,255,.12), transparent 32% 75%, rgba(115,210,255,.08));
    }

    h1 {
      position: relative;
      margin: 0 0 12px;
      font-size: clamp(2rem, 8vw, 2.5rem);
      letter-spacing: .045em;
      text-shadow: 0 2px 24px rgba(255, 218, 154, .38);
    }

    p { position: relative; margin: 14px 0; color: rgba(255,250,239,.9); font-size: 1.05rem; line-height: 1.6; }

    #addButton {
      --pointer-x: 50%;
      --pointer-y: 18%;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-width: 220px;
      margin: 18px 0 7px;
      padding: 19px 36px;
      border: 1px solid rgba(255,255,255,.88);
      border-radius: 999px;
      color: #281e3c;
      background:
        radial-gradient(ellipse at var(--pointer-x) var(--pointer-y), rgba(255,255,255,.98), transparent 30%),
        linear-gradient(145deg, rgba(255,255,255,.87), rgba(223,237,255,.27) 22%, transparent 43%),
        linear-gradient(115deg, #ffe8ac 0%, #ffc1a8 34%, #e8b9ff 66%, #a9eaff 100%);
      font: 900 1rem/1 "Segoe UI", Arial, sans-serif;
      letter-spacing: .2em;
      text-shadow: 0 1px 0 rgba(255,255,255,.8);
      cursor: pointer;
      transform: translateY(0);
      box-shadow: 0 2px 0 rgba(255,255,255,.78), 0 8px 0 #594b79, 0 15px 26px rgba(0,0,0,.4), 0 0 32px rgba(208,170,255,.32), inset 0 3px 4px rgba(255,255,255,.95), inset 0 -8px 12px rgba(81,58,119,.24);
      transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease, filter .22s ease;
      animation: breathe 4s ease-in-out infinite;
    }

    #addButton::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 4px 11px auto;
      height: 43%;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,255,255,.24) 54%, transparent);
      pointer-events: none;
    }

    #addButton::after {
      content: "";
      position: absolute;
      z-index: 1;
      top: -70%;
      bottom: -70%;
      left: -55%;
      width: 30%;
      border-radius: 50%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.98), rgba(255,255,255,.42), transparent);
      filter: blur(2px);
      transform: rotate(23deg);
      opacity: 0;
      pointer-events: none;
    }

    #addButton:hover {
      z-index: 2;
      transform: translateY(-6px) scale(1.045);
      filter: brightness(1.1) saturate(1.17);
      box-shadow: 0 3px 0 #fff0c8, 0 10px 0 #594b79, 0 22px 34px rgba(0,0,0,.45), 0 0 24px rgba(255,240,205,.7), 0 0 60px rgba(188,145,255,.45), inset 0 3px 4px #fff, inset 0 -8px 12px rgba(81,58,119,.2);
    }

    #addButton:hover::after { animation: shine .9s cubic-bezier(.2,.65,.3,1) forwards; }
    #addButton:active { transform: translateY(5px) scale(.985); box-shadow: 0 1px 0 #594b79, 0 4px 8px rgba(0,0,0,.4), inset 0 4px 9px rgba(81,58,119,.35); }
    #addButton:focus-visible { outline: 3px solid #fff4c9; outline-offset: 7px; }

    #addButton .ripple {
      position: absolute;
      z-index: 3;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,.85);
      transform: translate(-50%, -50%) scale(0);
      animation: ripple .65s ease-out forwards;
      pointer-events: none;
    }

    .count { display: inline-block; margin-top: 18px; color: var(--gold); font-size: 1.55rem; font-weight: 900; text-shadow: 0 0 22px rgba(255,195,91,.48); }

    @keyframes shine { from { left: -55%; opacity: 0; } 12% { opacity: 1; } to { left: 130%; opacity: 0; } }
    @keyframes ripple { to { transform: translate(-50%, -50%) scale(18); opacity: 0; } }
    @keyframes breathe { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.06); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="lightCanvas" aria-hidden="true"></canvas>
  <main class="card">
    <h1>Sign Goings</h1>
    <p>Click below to add your vote.</p>
    <button id="addButton" type="button">ADD VOTE</button>
    <p class="count">Votes: <span id="count">0</span></p>
  </main>

  <script>
    const button = document.getElementById('addButton');
    const countEl = document.getElementById('count');
    const canvas = document.getElementById('lightCanvas');
    const context = canvas.getContext('2d', { alpha: true });
    const storageKey = 'signgoings-count';
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let count = Number(localStorage.getItem(storageKey) || 0);
    let width = 0;
    let height = 0;
    let frameId = 0;
    let lastFrame = 0;
    let angle = 0;

    countEl.textContent = count;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawLight();
    }

    // Draw a small number of translucent beams; DPR and frame rate are capped for smooth, cool rendering.
    function drawLight() {
      if (!context) return;
      context.clearRect(0, 0, width, height);
      const cx = width * .78;
      const cy = height * .16;
      const radius = Math.max(width, height) * .9;
      const rays = 18;

      for (let i = 0; i < rays; i++) {
        const start = angle + (i / rays) * Math.PI * 2;
        const span = .035 + (i % 3) * .012;
        const hue = (38 + i * 19) % 360;
        const gradient = context.createRadialGradient(cx, cy, 0, cx, cy, radius);
        gradient.addColorStop(0, `hsla(${hue}, 100%, 77%, .12)`);
        gradient.addColorStop(1, `hsla(${hue}, 100%, 70%, 0)`);
        context.beginPath();
        context.moveTo(cx, cy);
        context.arc(cx, cy, radius, start, start + span);
        context.closePath();
        context.fillStyle = gradient;
        context.fill();
      }

      const glow = context.createRadialGradient(cx, cy, 0, cx, cy, radius * .42);
      glow.addColorStop(0, 'rgba(255, 236, 190, .19)');
      glow.addColorStop(1, 'rgba(255, 180, 120, 0)');
      context.fillStyle = glow;
      context.fillRect(0, 0, width, height);
    }

    function animate(timestamp) {
      frameId = 0;
      if (document.hidden || reducedMotion.matches) return;
      if (timestamp - lastFrame < 33) {
        frameId = requestAnimationFrame(animate);
        return;
      }
      lastFrame = timestamp;
      angle += .0018;
      drawLight();
      frameId = requestAnimationFrame(animate);
    }

    function startAnimation() {
      if (!reducedMotion.matches && !document.hidden && !frameId) frameId = requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resizeCanvas, { passive: true });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && frameId) {
        cancelAnimationFrame(frameId);
        frameId = 0;
      } else {
        startAnimation();
      }
    });
    reducedMotion.addEventListener?.('change', () => {
      if (reducedMotion.matches && frameId) {
        cancelAnimationFrame(frameId);
        frameId = 0;
        drawLight();
      } else startAnimation();
    });

    button.addEventListener('pointermove', (event) => {
      const bounds = button.getBoundingClientRect();
      button.style.setProperty('--pointer-x', `${((event.clientX - bounds.left) / bounds.width) * 100}%`);
      button.style.setProperty('--pointer-y', `${((event.clientY - bounds.top) / bounds.height) * 100}%`);
    }, { passive: true });

    button.addEventListener('click', (event) => {
      count += 1;
      localStorage.setItem(storageKey, String(count));
      countEl.textContent = count;

      const bounds = button.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.setAttribute('aria-hidden', 'true');
      ripple.style.left = `${event.clientX - bounds.left}px`;
      ripple.style.top = `${event.clientY - bounds.top}px`;
      button.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
    });

    resizeCanvas();
    startAnimation();
  </script>
</body>
</html>
