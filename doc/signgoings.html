<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Goings</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #f9fafb;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .card {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 32px 24px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 14px 0;
    }
    button {
      background: #f59e0b;
      color: #111827;
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }
    .count {
      display: inline-block;
      margin-top: 16px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #fbbf24;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Click the button</h1>
    <p>This is just a harmless little prank: every click adds 1.</p>
    <button id="addButton" type="button">Add 1</button>
    <p class="count">Total: <span id="count">0</span></p>
  </div>

  <script>
    const button = document.getElementById('addButton');
    const countEl = document.getElementById('count');
    const storageKey = 'signgoings-count';

    let count = Number(localStorage.getItem(storageKey) || 0);
    countEl.textContent = count;

    button.addEventListener('click', () => {
      count += 1;
      localStorage.setItem(storageKey, String(count));
      countEl.textContent = count;
    });
  </script>
</body>
</html>
