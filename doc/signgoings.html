<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#78b9d1">
  <title>the Click — Aero Camera Club</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      --ink: #20394c;
      --glass: rgba(235, 250, 255, .52);
      --blue: #28799d;
      --pink: #e9818a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 28px;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 43%, rgba(255,244,197,.96) 0 5%, rgba(255,197,135,.62) 13%, transparent 36%),
        radial-gradient(ellipse at 14% 12%, rgba(93,211,226,.9), transparent 35%),
        radial-gradient(ellipse at 89% 78%, rgba(238,115,133,.78), transparent 36%),
        linear-gradient(145deg, #76c6dc 0%, #b8e3e5 34%, #efc8b7 68%, #f1a4a0 100%);
      isolation: isolate;
    }
    /* Warm vignette + fine analog-film grain for a sunny 2010 point-and-shoot feel. */
    body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; }
    body::before {
      z-index: -1;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(41,35,54,.13) 100%), linear-gradient(115deg, rgba(255,255,255,.2), transparent 40%, rgba(255,120,105,.13));
      mix-blend-mode: multiply;
    }
    body::after {
      z-index: 4;
      opacity: .14;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    }
    .sunflare {
      position: fixed; z-index: -1; width: min(60vw, 650px); aspect-ratio: 1; left: 50%; top: 45%;
      transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none;
      background: repeating-conic-gradient(from 2deg, rgba(255,255,235,.2) 0deg 3deg, transparent 3deg 13deg);
      mask-image: radial-gradient(circle, #000 0 9%, transparent 70%);
      animation: sun-turn 90s linear infinite;
    }
    .window {
      width: min(560px, 100%);
      padding: 7px;
      border: 1px solid rgba(255,255,255,.92);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(208,239,250,.38) 46%, rgba(255,255,255,.62));
      box-shadow: 0 2px 0 rgba(255,255,255,.95) inset, 0 0 0 1px rgba(48,110,137,.25), 0 22px 65px rgba(36,67,84,.34), 0 5px 14px rgba(255,255,255,.5);
      -webkit-backdrop-filter: blur(18px) saturate(1.45);
      backdrop-filter: blur(18px) saturate(1.45);
    }
    .titlebar {
      min-height: 38px; padding: 0 13px; display: flex; align-items: center; justify-content: space-between;
      color: #23465b; font-size: .79rem; font-weight: 700; text-shadow: 0 1px #fff;
      border-radius: 10px 10px 3px 3px;
      background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(170,220,239,.58) 48%, rgba(255,255,255,.48));
      box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 -1px 0 rgba(66,133,164,.18) inset;
    }
    .window-lights { display: flex; gap: 6px; }
    .window-lights i { width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(#fff, #68b7d1); border: 1px solid rgba(48,111,135,.45); box-shadow: 0 1px 2px #fff inset; }
    .window-lights i:first-child { background: linear-gradient(#fff, #f3988a); }
    .card {
      position: relative; overflow: hidden; padding: clamp(32px, 8vw, 54px) 25px 31px; text-align: center;
      border: 1px solid rgba(255,255,255,.85); border-top-color: rgba(255,255,255,.98); border-radius: 5px 5px 10px 10px;
      background: linear-gradient(145deg, rgba(255,255,255,.73), rgba(244,251,248,.58) 48%, rgba(255,239,221,.56));
      box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(76,132,153,.18), 0 8px 22px rgba(44,91,111,.17);
    }
    .card::before {
      content: ""; position: absolute; width: 340px; height: 210px; top: -145px; left: 50%; transform: translateX(-50%);
      border-radius: 50%; background: rgba(255,248,207,.9); filter: blur(32px); pointer-events: none;
    }
    .badge { position: relative; display: inline-block; margin-bottom: 12px; padding: 6px 12px; border: 1px solid rgba(255,255,255,.95); border-radius: 999px; background: linear-gradient(#fff, rgba(226,246,250,.58)); box-shadow: 0 2px 7px rgba(55,111,133,.12); color: #527b8b; font-size: .68rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { position: relative; margin: 0; color: #fff; font-size: clamp(3rem, 12vw, 5rem); font-weight: 900; line-height: .98; letter-spacing: -.075em; -webkit-text-stroke: 1px rgba(255,255,255,.85); text-shadow: 0 2px 0 #6faabe, 0 4px 0 #528ba1, 0 7px 0 #397489, 0 10px 16px rgba(42,94,115,.38), 0 0 34px rgba(255,255,255,.9); }
    .subtitle { position: relative; margin: 18px 0 22px; color: #3c6171; font-size: 1rem; line-height: 1.65; text-shadow: 0 1px rgba(255,255,255,.8); }
    .camera-frame { position: relative; width: fit-content; margin: 0 auto; padding: 7px; border-radius: 25px; background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(128,203,220,.62) 40%, rgba(236,145,151,.62)); box-shadow: 0 2px 0 #fff inset, 0 8px 20px rgba(57,106,126,.23), 0 0 30px rgba(255,255,255,.72); }
    #addButton {
      position: relative; isolation: isolate; overflow: hidden; min-width: 230px; padding: 20px 34px;
      border: 1px solid rgba(255,255,255,.98); border-radius: 19px; color: #23536a;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,1), transparent 58%), linear-gradient(180deg, rgba(255,255,255,.9), rgba(181,229,240,.7) 47%, rgba(105,176,199,.8));
      box-shadow: 0 1px 0 #fff inset, 0 -2px 0 rgba(53,121,146,.22) inset, 0 3px 0 rgba(255,255,255,.96), 0 6px 0 #5291a8, 0 12px 20px rgba(45,99,119,.29), 0 0 26px rgba(255,255,255,.8);
      font: 900 1.08rem/1 "Segoe UI", Arial, sans-serif; letter-spacing: .26em; text-shadow: 0 1px #fff;
      cursor: pointer; transition: transform .16s ease, filter .2s ease, box-shadow .2s ease;
    }
    #addButton::before { content: ""; position: absolute; z-index: -1; inset: 3px 8px auto; height: 43%; border-radius: 14px; background: linear-gradient(rgba(255,255,255,.96), rgba(255,255,255,.22), transparent); }
    #addButton::after { content: ""; position: absolute; z-index: 1; top: -60%; bottom: -60%; left: -52%; width: 28%; transform: rotate(23deg); background: linear-gradient(90deg, transparent, rgba(255,255,255,.98), transparent); pointer-events: none; }
    #addButton:hover { transform: translateY(-3px); filter: brightness(1.08) saturate(1.15); box-shadow: 0 1px 0 #fff inset, 0 -2px 0 rgba(53,121,146,.2) inset, 0 4px 0 #fff, 0 8px 0 #5291a8, 0 16px 27px rgba(45,99,119,.34), 0 0 38px rgba(255,255,255,.96); }
    #addButton:hover::after { animation: flash .8s ease-out; }
    #addButton:active { transform: translateY(5px); box-shadow: 0 1px 0 #fff inset, 0 -2px 0 rgba(53,121,146,.22) inset, 0 1px 0 #5291a8, 0 3px 8px rgba(45,99,119,.28); }
    #addButton:focus-visible, .home-link:focus-visible { outline: 3px solid #e67c8c; outline-offset: 5px; }
    .count { position: relative; display: inline-block; margin: 24px 0 8px; padding: 11px 18px; border: 1px solid rgba(255,255,255,.95); border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(233,247,247,.58)); box-shadow: inset 0 1px 0 #fff, 0 4px 13px rgba(64,112,129,.13); color: #476d7c; font-size: .96rem; font-weight: 700; }
    #count { color: #dd6878; font-size: 1.35rem; font-weight: 900; text-shadow: 0 1px #fff, 0 0 15px rgba(245,141,146,.48); }
    .home-link { position: relative; display: block; width: fit-content; margin: 13px auto 0; padding: 8px 15px; border: 1px solid transparent; border-radius: 999px; color: #557987; font-size: .9rem; font-weight: 700; text-decoration: none; text-shadow: 0 1px #fff; transition: background .2s ease, border-color .2s ease; }
    .home-link:hover { border-color: rgba(255,255,255,.85); background: rgba(255,255,255,.48); }
    .caption { margin-top: 20px; color: rgba(54,91,105,.77); font-size: .68rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    .pop { animation: pop .35s cubic-bezier(.2,.8,.2,1); }
    @keyframes flash { from { left: -52%; opacity: 0; } 15% { opacity: 1; } to { left: 125%; opacity: 0; } }
    @keyframes pop { 45% { transform: scale(1.13); color: #e45e75; } }
    @keyframes sun-turn { to { transform: translate(-50%,-50%) rotate(360deg); } }
    @media (max-width: 480px) { body { padding: 15px; } .card { padding-inline: 16px; } #addButton { min-width: 205px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="sunflare" aria-hidden="true"></div>
  <main class="window">
    <div class="titlebar"><span>✦ the Click — sunny side up</span><span class="window-lights" aria-hidden="true"><i></i><i></i><i></i></span></div>
    <section class="card">
      <span class="badge">A little internet nostalgia · 2010</span>
      <h1>the Click</h1>
      <p class="subtitle">A tiny bit of sunshine for your day.<br>Go on — make the number go up!</p>
      <div class="camera-frame"><button id="addButton" type="button">CLICK!</button></div>
      <p class="count" aria-live="polite">Clicks collected: <span id="count">0</span></p>
      <a class="home-link" href="../index.html">← Take me home</a>
      <div class="caption">✦ keep clicking, keep glowing ✦</div>
    </section>
  </main>
  <script>
    const button = document.getElementById('addButton');
    const countEl = document.getElementById('count');
    const storageKey = 'signgoings-count';

    function readCount() {
      try {
        const saved = Number.parseInt(localStorage.getItem(storageKey), 10);
        return Number.isSafeInteger(saved) && saved >= 0 ? saved : 0;
      } catch (error) {
        return 0;
      }
    }

    let count = readCount();
    countEl.textContent = count;

    button.addEventListener('click', () => {
      count += 1;
      countEl.textContent = count;
      try {
        localStorage.setItem(storageKey, String(count));
      } catch (error) {
        // Keep the counter working for this page view if storage is unavailable.
      }
      countEl.classList.remove('pop');
      void countEl.offsetWidth;
      countEl.classList.add('pop');
    });
  </script>
</body>
</html>
