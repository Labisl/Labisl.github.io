<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101426">
  <title>the Click</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      --glass: rgba(26, 31, 54, .58);
      --text: #fffaf1;
      --gold: #ffe6a0;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      padding: 24px;
      color: var(--text);
      text-align: center;
      background:
        radial-gradient(ellipse at 75% 15%, rgba(255,139,103,.3), transparent 34%),
        radial-gradient(ellipse at 15% 85%, rgba(111,95,255,.26), transparent 38%),
        linear-gradient(145deg, #101629, #242b48 52%, #11182d);
    }
    #lightCanvas {
      position: fixed;
      z-index: -1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: .95;
    }
    .card {
      position: relative;
      width: min(460px, 100%);
      padding: 46px 32px 35px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255,255,255,.17), var(--glass) 42%, rgba(13,17,34,.74));
      box-shadow: 0 32px 90px rgba(0,0,0,.46), 0 0 70px rgba(255,133,132,.12), inset 0 1px 0 rgba(255,255,255,.36), inset 0 -1px 0 rgba(255,255,255,.08);
      -webkit-backdrop-filter: blur(22px) saturate(1.45);
      backdrop-filter: blur(22px) saturate(1.45);
    }
    .card::before {
      content: ""; position: absolute; top: -150px; right: -100px; width: 300px; height: 240px;
      border-radius: 50%; background: rgba(255,184,122,.26); filter: blur(68px); pointer-events: none;
    }
    .card::after {
      content: ""; position: absolute; inset: 1px; border-radius: inherit; pointer-events: none;
      background: linear-gradient(125deg, rgba(255,255,255,.12), transparent 32% 75%, rgba(115,210,255,.08));
    }
    h1 { position: relative; margin: 0 0 12px; font-size: clamp(2rem, 8vw, 2.5rem); letter-spacing: .045em; text-shadow: 0 2px 24px rgba(255,218,154,.38); }
    p { position: relative; margin: 14px 0; color: rgba(255,250,239,.9); font-size: 1.05rem; line-height: 1.6; }
    #addButton {
      --pointer-x: 50%; --pointer-y: 18%;
      position: relative; isolation: isolate; overflow: hidden; min-width: 220px; margin: 18px 0 7px; padding: 19px 36px;
      border: 1px solid rgba(255,255,255,.88); border-radius: 999px; color: #281e3c;
      background: radial-gradient(ellipse at var(--pointer-x) var(--pointer-y), rgba(255,255,255,.98), transparent 30%),
        linear-gradient(145deg, rgba(255,255,255,.87), rgba(223,237,255,.27) 22%, transparent 43%),
        linear-gradient(115deg, #ffe8ac 0%, #ffc1a8 34%, #e8b9ff 66%, #a9eaff 100%);
      font: 900 1rem/1 "Segoe UI", Arial, sans-serif; letter-spacing: .2em; text-shadow: 0 1px 0 rgba(255,255,255,.8);
      cursor: pointer; transform: translateY(0);
      box-shadow: 0 2px 0 rgba(255,255,255,.78), 0 8px 0 #594b79, 0 15px 26px rgba(0,0,0,.4), 0 0 32px rgba(208,170,255,.32), inset 0 3px 4px rgba(255,255,255,.95), inset 0 -8px 12px rgba(81,58,119,.24);
      transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease, filter .22s ease;
      animation: breathe 4s ease-in-out infinite;
    }
    #addButton::before {
      content: ""; position: absolute; z-index: -1; inset: 4px 11px auto; height: 43%; border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,255,255,.24) 54%, transparent); pointer-events: none;
    }
    #addButton::after {
      content: ""; position: absolute; z-index: 1; top: -70%; bottom: -70%; left: -55%; width: 30%; border-radius: 50%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.98), rgba(255,255,255,.42), transparent);
      filter: blur(2px); transform: rotate(23deg); opacity: 0; pointer-events: none;
    }
    #addButton:hover {
      z-index: 2; transform: translateY(-6px) scale(1.045); filter: brightness(1.1) saturate(1.17);
      box-shadow: 0 3px 0 #fff0c8, 0 10px 0 #594b79, 0 22px 34px rgba(0,0,0,.45), 0 0 24px rgba(255,240,205,.7), 0 0 60px rgba(188,145,255,.45), inset 0 3px 4px #fff, inset 0 -8px 12px rgba(81,58,119,.2);
    }
    #addButton:hover::after { animation: shine .9s cubic-bezier(.2,.65,.3,1) forwards; }
    #addButton:active { transform: translateY(5px) scale(.985); box-shadow: 0 1px 0 #594b79, 0 4px 8px rgba(0,0,0,.4), inset 0 4px 9px rgba(81,58,119,.35); }
    #addButton:focus-visible { outline: 3px solid #fff4c9; outline-offset: 7px; }
    #addButton .ripple {
      position: absolute; z-index: 3; width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.85);
      transform: translate(-50%,-50%) scale(0); animation: ripple .65s ease-out forwards; pointer-events: none;
    }
    .count { display: inline-block; margin-top: 18px; color: var(--gold); font-size: 1.55rem; font-weight: 900; text-shadow: 0 0 22px rgba(255,195,91,.48); }
    .count.pop { animation: count-pop .38s cubic-bezier(.2,.8,.2,1); }
    .home-link {
      position: relative; display: inline-block; margin-top: 10px; padding: 8px 14px; border-radius: 999px;
      color: rgba(255,250,241,.76); font-size: .9rem; text-decoration: none; transition: color .2s ease, background .2s ease;
    }
    .home-link:hover { color: #fff; background: rgba(255,255,255,.1); }
    .home-link:focus-visible { outline: 2px solid #fff4c9; outline-offset: 3px; }
    @keyframes shine { from { left: -55%; opacity: 0; } 12% { opacity: 1; } to { left: 130%; opacity: 0; } }
    @keyframes ripple { to { transform: translate(-50%,-50%) scale(18); opacity: 0; } }
    @keyframes breathe { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.06); } }
    @keyframes count-pop { 0% { transform: scale(1); } 45% { transform: scale(1.32); color: #fff; text-shadow: 0 0 28px #ffc7ff; } 100% { transform: scale(1); } }
    @keyframes card-bump { 35% { transform: scale(1.018); } 100% { transform: scale(1); } }
    .card.bump { animation: card-bump .32s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="lightCanvas" aria-hidden="true"></canvas>
  <main class="card" id="card">
    <h1>the Click</h1>
    <p>Click here! You *KNOW* you WANT TO...</p>
    <button id="addButton" type="button">CLICK</button>
    <p class="count" aria-live="polite">People who clicked: <span id="count">0</span></p>
    <a class="home-link" href="../index.html">Take me home</a>
  </main>

  <script>
    const button = document.getElementById('addButton');
    const countEl = document.getElementById('count');
    const countLabel = document.querySelector('.count');
    const card = document.getElementById('card');
    const canvas = document.getElementById('lightCanvas');
    const gl = canvas.getContext('webgl', { alpha: true, antialias: false, powerPreference: 'high-performance' });
    const storageKey = 'signgoings-count';
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let count = Number(localStorage.getItem(storageKey) || 0);
    let width = 0, height = 0, frameId = 0, lastFrame = 0, startTime = performance.now();
    let buttonCenter = [0, 0], buttonSize = [1, 1], pointer = [0, 0], audioContext;
    let program, resolutionLocation, timeLocation, buttonLocation, buttonSizeLocation, pointerLocation;

    countEl.textContent = count;

    const vertexShaderSource = `
      attribute vec2 a_position;
      void main() { gl_Position = vec4(a_position, 0.0, 1.0); }
    `;

    const fragmentShaderSource = `
      precision highp float;
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_button;
      uniform vec2 u_buttonSize;
      uniform vec2 u_pointer;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      void main() {
        vec2 pixel = gl_FragCoord.xy;
        vec2 sun = vec2(u_resolution.x * 0.78, u_resolution.y * 0.82);
        vec2 sunVector = (pixel - sun) / max(u_resolution.y, 1.0);
        float distanceFromSun = length(sunVector);
        float angle = atan(sunVector.y, sunVector.x);
        float rotation = u_time * 0.055;

        float rayFine = pow(max(0.0, cos(angle * 31.0 + rotation)), 24.0);
        float rayWide = pow(max(0.0, cos(angle * 13.0 - rotation * 0.7)), 11.0);
        float rayGlint = pow(max(0.0, cos(angle * 47.0 + rotation * 1.4)), 48.0);
        float radialFade = 1.0 - smoothstep(0.08, 1.12, distanceFromSun);
        float sunCore = exp(-distanceFromSun * 8.0);
        float beams = (rayFine * 0.13 + rayWide * 0.075 + rayGlint * 0.055) * radialFade;

        float buttonDistance = length((pixel - u_button) / max(u_buttonSize * vec2(0.82, 2.8), vec2(1.0)));
        float buttonHalo = exp(-buttonDistance * 2.8) * (1.0 - smoothstep(1.25, 2.1, buttonDistance));
        float pointerDistance = length((pixel - u_pointer) / max(u_resolution.y * 0.22, 1.0));
        float pointerGlow = exp(-pointerDistance * 3.2) * 0.08;

        float colorWave = 0.5 + 0.5 * sin(angle * 2.0 + u_time * 0.12 + distanceFromSun * 3.0);
        vec3 warm = vec3(1.0, 0.49, 0.32);
        vec3 pink = vec3(1.0, 0.30, 0.76);
        vec3 cyan = vec3(0.31, 0.78, 1.0);
        vec3 prism = mix(mix(warm, pink, smoothstep(0.12, 0.72, colorWave)), cyan, smoothstep(0.62, 1.0, colorWave));
        vec3 color = prism * (beams + sunCore * 0.17);
        color += vec3(1.0, 0.76, 0.44) * sunCore * 0.11;
        color += mix(vec3(0.72, 0.43, 1.0), vec3(0.34, 0.82, 1.0), colorWave) * buttonHalo * 0.24;
        color += vec3(1.0, 0.84, 0.98) * pointerGlow;

        float alpha = clamp(beams * 0.9 + sunCore * 0.14 + buttonHalo * 0.3 + pointerGlow * 0.35, 0.0, 0.48);
        float grain = (hash(floor(pixel * 0.5) + floor(u_time * 8.0)) - 0.5) * 0.008 * alpha;
        color = max(color + grain, vec3(0.0));
        gl_FragColor = vec4(color * alpha, alpha);
      }
    `;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.warn('WebGL shader compilation failed:', gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    function initWebGL() {
      if (!gl) return false;
      const vertexShader = compileShader(gl.VERTEX_SHADER, vertexShaderSource);
      const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource);
      if (!vertexShader || !fragmentShader) return false;
      program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);
      gl.deleteShader(vertexShader);
      gl.deleteShader(fragmentShader);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.warn('WebGL program linking failed:', gl.getProgramInfoLog(program));
        return false;
      }

      gl.useProgram(program);
      const vertices = new Float32Array([-1, -1, 3, -1, -1, 3]);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
      const positionLocation = gl.getAttribLocation(program, 'a_position');
      gl.enableVertexAttribArray(positionLocation);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
      resolutionLocation = gl.getUniformLocation(program, 'u_resolution');
      timeLocation = gl.getUniformLocation(program, 'u_time');
      buttonLocation = gl.getUniformLocation(program, 'u_button');
      buttonSizeLocation = gl.getUniformLocation(program, 'u_buttonSize');
      pointerLocation = gl.getUniformLocation(program, 'u_pointer');
      gl.clearColor(0, 0, 0, 0);
      return true;
    }

    function updateButtonPosition() {
      const bounds = button.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      buttonCenter = [bounds.left * dpr + bounds.width * dpr / 2, (height - (bounds.top * dpr + bounds.height * dpr / 2))];
      buttonSize = [bounds.width * dpr, bounds.height * dpr];
      if (!pointer[0] && !pointer[1]) pointer = [...buttonCenter];
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      const pixelWidth = Math.round(width * dpr);
      const pixelHeight = Math.round(height * dpr);
      if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
      }
      if (gl && program) {
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.useProgram(program);
        gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
      }
      updateButtonPosition();
      render(performance.now());
    }

    function render(timestamp) {
      if (!gl || !program) return;
      gl.useProgram(program);
      gl.uniform1f(timeLocation, (timestamp - startTime) * 0.001);
      gl.uniform2f(buttonLocation, buttonCenter[0], buttonCenter[1]);
      gl.uniform2f(buttonSizeLocation, buttonSize[0], buttonSize[1]);
      gl.uniform2f(pointerLocation, pointer[0], pointer[1]);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    function animate(timestamp) {
      frameId = 0;
      if (document.hidden || reducedMotion.matches || !gl) return;
      if (timestamp - lastFrame < 1000 / 60) { frameId = requestAnimationFrame(animate); return; }
      lastFrame = timestamp;
      render(timestamp);
      frameId = requestAnimationFrame(animate);
    }

    function startAnimation() {
      if (!reducedMotion.matches && !document.hidden && !frameId && gl) frameId = requestAnimationFrame(animate);
    }

    function playClickChime() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioContext ||= new AudioContextClass();
        if (audioContext.state === 'suspended') audioContext.resume();
        const now = audioContext.currentTime;
        [659.25, 987.77].forEach((frequency, index) => {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(frequency, now + index * .055);
          gain.gain.setValueAtTime(.0001, now + index * .055);
          gain.gain.exponentialRampToValueAtTime(index ? .045 : .065, now + index * .055 + .012);
          gain.gain.exponentialRampToValueAtTime(.0001, now + index * .055 + .42);
          oscillator.connect(gain); gain.connect(audioContext.destination);
          oscillator.start(now + index * .055); oscillator.stop(now + index * .055 + .44);
        });
      } catch (error) {
        // Optional audio; ignore if unsupported.
      }
    }

    window.addEventListener('resize', resizeCanvas, { passive: true });
    window.addEventListener('scroll', updateButtonPosition, { passive: true });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && frameId) { cancelAnimationFrame(frameId); frameId = 0; }
      else startAnimation();
    });
    reducedMotion.addEventListener?.('change', () => {
      if (reducedMotion.matches && frameId) { cancelAnimationFrame(frameId); frameId = 0; render(performance.now()); }
      else startAnimation();
    });

    button.addEventListener('pointermove', (event) => {
      const bounds = button.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      button.style.setProperty('--pointer-x', `${((event.clientX - bounds.left) / bounds.width) * 100}%`);
      button.style.setProperty('--pointer-y', `${((event.clientY - bounds.top) / bounds.height) * 100}%`);
      pointer = [event.clientX * dpr, (height - event.clientY) * dpr];
      if (reducedMotion.matches) render(performance.now());
    }, { passive: true });

    button.addEventListener('click', (event) => {
      playClickChime();
      count += 1;
      localStorage.setItem(storageKey, String(count));
      countEl.textContent = count;
      countLabel.classList.remove('pop');
      card.classList.remove('bump');
      void countLabel.offsetWidth;
      countLabel.classList.add('pop');
      card.classList.add('bump');

      const bounds = button.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.setAttribute('aria-hidden', 'true');
      ripple.style.left = `${event.clientX - bounds.left}px`;
      ripple.style.top = `${event.clientY - bounds.top}px`;
      button.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
    });

    if (!initWebGL()) canvas.style.display = 'none';
    resizeCanvas();
    startAnimation();
  </script>
</body>
</html>
