<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 2em;
        }
        
        .back-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .back-btn:hover {
            background: #764ba2;
        }
        
        .tracks-list {
            display: grid;
            gap: 20px;
        }
        
        .track {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .track:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .track-name {
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        
        .track-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        audio {
            flex: 1;
            min-width: 200px;
            height: 30px;
        }
        
        .speed-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .speed-btn {
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }
        
        .speed-btn:hover {
            background: #764ba2;
        }
        
        .speed-btn.active {
            background: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.5);
        }
        
        .speed-display {
            font-size: 0.85em;
            font-weight: 600;
            color: #667eea;
            min-width: 45px;
            text-align: center;
        }
        
        .download-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9em;
            font-weight: 600;
            transition: background 0.3s;
            display: inline-block;
            white-space: nowrap;
        }
        
        .download-btn:hover {
            background: #764ba2;
        }
        
        .copyright-note {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #666;
            font-size: 0.9em;
            text-align: center;
        }
        
        .copyright-note a {
            color: #667eea;
            text-decoration: none;
        }
        
        .copyright-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>

    <script>
        document.querySelectorAll('.track').forEach(track => {
            const audio = track.querySelector('audio');
            const speedButtons = track.querySelectorAll('.speed-btn');
            
            speedButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const speed = parseFloat(this.getAttribute('data-speed'));
                    audio.playbackRate = speed;
                    
                    // Update active button styling
                    speedButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
