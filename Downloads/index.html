<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My projects you can Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 2em;
        }
        
        .back-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .back-btn:hover {
            background: #764ba2;
        }
        
        .tracks-list {
            display: grid;
            gap: 20px;
        }
        
        .track {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .track:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .track-name {
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        
        .track-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        audio {
            flex: 1;
            min-width: 200px;
            height: 30px;
        }
        
        .download-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9em;
            font-weight: 600;
            transition: background 0.3s;
            display: inline-block;
            white-space: nowrap;
        }
        
        .download-btn:hover {
            background: #764ba2;
        }
        
        .copyright-note {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #666;
            font-size: 0.9em;
            text-align: center;
        }
        
        .copyright-note a {
            color: #667eea;
            text-decoration: none;
        }
        
        .copyright-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>My Projects</h1>
            <a href="../index.html" class="back-btn">← Home</a>
        </header>
        
        <div class="tracks-list">
            <div class="track">
                <div class="track-name">Aspire Ambient</div>
                <div class="track-controls">
                    <audio controls>
                        <source src="Aspire-Ambient.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                    <a href="aspire-ambient.mp3" download class="download-btn">Download</a>
                </div>
            </div>
            
            <div class="track">
                <div class="track-name">End Of Space</div>
                <div class="track-controls">
                    <audio controls>
                        <source src="NowWeAreinSpace.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                    <a href="NowWeAreinSpace.mp3" download class="download-btn">Download</a>
                </div>
            </div>
            
            <div class="track">
                <div class="track-name">Intro Theme (Aspire)</div>
                <div class="track-controls">
                    <audio controls>
                        <source src="IntroTheme(aspire).wav" type="audio/wav">
                        Your browser does not support the audio element.
                    </audio>
                    <a href="IntroTheme(aspire).wav" download class="download-btn">Download</a>
                </div>
            </div>
        </div>
        
        <div class="copyright-note">
            <p>For copyright information and licensing, see the <a href="COPYRIGHTINFO.txt">copyright licence</a></p>
        </div>
    </div>
</body>
</html>
